name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build HUD module + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repository does not commit a Gradle wrapper JAR (see docs/reference/build.md),
      # so the distribution is provisioned by the action instead of ./gradlew.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-build-output
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/logs/**
            app/build/reports/tests/**
            app/build/test-results/**
